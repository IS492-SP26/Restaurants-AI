<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" fill="none">
  <rect width="1600" height="980" fill="#FDFEFE"/>
  <text x="800" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#13294B">
    Restaurant Startup Studio Architecture
  </text>

  <defs>
    <style>
      .box { fill: #FFFFFF; stroke: #13294B; stroke-width: 2; rx: 16; ry: 16; }
      .group { fill: #F2F6FC; stroke: #13294B; stroke-width: 2; rx: 20; ry: 20; }
      .accent { fill: #FFF1E8; stroke: #FF5F05; stroke-width: 2; rx: 16; ry: 16; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 600; fill: #13294B; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #13294B; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #13294B; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#13294B"/>
    </marker>
  </defs>

  <rect x="60" y="110" width="180" height="80" class="accent"/>
  <text x="150" y="150" text-anchor="middle" class="label">Founder / User</text>
  <text x="150" y="173" text-anchor="middle" class="small">Enters startup constraints</text>

  <rect x="290" y="95" width="240" height="110" class="box"/>
  <text x="410" y="132" text-anchor="middle" class="label">`/plan`</text>
  <text x="410" y="158" text-anchor="middle" class="small">FounderForm</text>
  <text x="410" y="180" text-anchor="middle" class="tiny">location, budget, goals</text>

  <rect x="590" y="95" width="220" height="110" class="box"/>
  <text x="700" y="132" text-anchor="middle" class="label">`/api/suggestions`</text>
  <text x="700" y="158" text-anchor="middle" class="small">validate founder input</text>
  <text x="700" y="180" text-anchor="middle" class="tiny">returns 3 concept cards</text>

  <rect x="870" y="95" width="250" height="110" class="box"/>
  <text x="995" y="132" text-anchor="middle" class="label">Suggestion engine</text>
  <text x="995" y="158" text-anchor="middle" class="small">`generateSuggestions()`</text>
  <text x="995" y="180" text-anchor="middle" class="tiny">concept templates + rules</text>

  <rect x="650" y="245" width="230" height="74" class="accent"/>
  <text x="765" y="277" text-anchor="middle" class="label">sessionStorage</text>
  <text x="765" y="300" text-anchor="middle" class="small">suggestions + manual payloads</text>

  <rect x="290" y="380" width="240" height="110" class="box"/>
  <text x="410" y="417" text-anchor="middle" class="label">`/suggestions`</text>
  <text x="410" y="443" text-anchor="middle" class="small">SuggestionsClient</text>
  <text x="410" y="465" text-anchor="middle" class="tiny">choose one concept</text>

  <rect x="590" y="380" width="220" height="110" class="box"/>
  <text x="700" y="417" text-anchor="middle" class="label">`/api/manual`</text>
  <text x="700" y="443" text-anchor="middle" class="small">normalize manual request</text>
  <text x="700" y="465" text-anchor="middle" class="tiny">returns manual + trace</text>

  <rect x="870" y="350" width="560" height="430" class="group"/>
  <text x="1150" y="387" text-anchor="middle" class="label">Manual generation pipeline</text>
  <text x="1150" y="410" text-anchor="middle" class="small">`runRestaurantManualPipeline()`</text>

  <rect x="900" y="445" width="190" height="86" class="box"/>
  <text x="995" y="480" text-anchor="middle" class="label">Marketing Agent</text>
  <text x="995" y="504" text-anchor="middle" class="tiny">fine-tuned slot or fallback</text>

  <rect x="1110" y="445" width="190" height="86" class="box"/>
  <text x="1205" y="480" text-anchor="middle" class="label">Financial Agent</text>
  <text x="1205" y="504" text-anchor="middle" class="tiny">fine-tuned slot or fallback</text>

  <rect x="900" y="555" width="190" height="86" class="box"/>
  <text x="995" y="590" text-anchor="middle" class="label">Regulatory Agent</text>
  <text x="995" y="614" text-anchor="middle" class="tiny">fine-tuned slot or fallback</text>

  <rect x="1110" y="555" width="190" height="86" class="box"/>
  <text x="1205" y="590" text-anchor="middle" class="label">Operations Agent</text>
  <text x="1205" y="614" text-anchor="middle" class="tiny">fine-tuned slot or fallback</text>

  <rect x="1320" y="485" width="90" height="116" class="accent"/>
  <text x="1365" y="535" text-anchor="middle" class="label">Composer</text>
  <text x="1365" y="558" text-anchor="middle" class="tiny">manual</text>

  <rect x="900" y="680" width="510" height="75" class="group"/>
  <text x="1155" y="711" text-anchor="middle" class="label">Grounding data / connectors</text>
  <text x="1155" y="735" text-anchor="middle" class="small">
    marketing data, financial snapshots, regulatory rules, operations standards
  </text>

  <rect x="290" y="650" width="240" height="110" class="box"/>
  <text x="410" y="687" text-anchor="middle" class="label">`/manual`</text>
  <text x="410" y="713" text-anchor="middle" class="small">ManualPageClient</text>
  <text x="410" y="735" text-anchor="middle" class="tiny">ManualDocument render</text>

  <rect x="60" y="780" width="300" height="120" class="group"/>
  <text x="210" y="818" text-anchor="middle" class="label">Monitoring / ops</text>
  <text x="210" y="844" text-anchor="middle" class="small">`/agents` + `api/fine-tune-status`</text>
  <text x="210" y="868" text-anchor="middle" class="tiny">job status, model ids, sync visibility</text>

  <line x1="240" y1="150" x2="290" y2="150" stroke="#13294B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="530" y1="150" x2="590" y2="150" stroke="#13294B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="810" y1="150" x2="870" y2="150" stroke="#13294B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="205" x2="740" y2="245" stroke="#13294B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="765" y1="319" x2="765" y2="350" stroke="#13294B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="650" y1="435" x2="530" y2="435" stroke="#13294B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="810" y1="435" x2="870" y2="435" stroke="#13294B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1090" y1="490" x2="1110" y2="490" stroke="#13294B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1090" y1="600" x2="1110" y2="600" stroke="#13294B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1300" y1="490" x2="1320" y2="520" stroke="#13294B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1300" y1="600" x2="1320" y2="565" stroke="#13294B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1365" y1="601" x2="1365" y2="650" stroke="#13294B" stroke-width="3"/>
  <line x1="1365" y1="650" x2="530" y2="705" stroke="#13294B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1155" y1="680" x2="995" y2="641" stroke="#13294B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1155" y1="680" x2="1205" y2="641" stroke="#13294B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1155" y1="680" x2="995" y2="531" stroke="#13294B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1155" y1="680" x2="1205" y2="531" stroke="#13294B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="820" x2="930" y2="780" stroke="#13294B" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
</svg>
