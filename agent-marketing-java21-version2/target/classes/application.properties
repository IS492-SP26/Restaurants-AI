server.port=8081
spring.application.name=restaurant-marketing-agent

# Groq API - set via environment variable: MARKETING_GROQ_API_KEY
marketing.groq.api-key=${MARKETING_GROQ_API_KEY:}
marketing.groq.base-url=https://api.openai.com/v1
marketing.groq.primary-model=gpt-4o
marketing.groq.fast-model=gpt-3.5-turbo
marketing.groq.max-tokens=4096
marketing.groq.temperature=0.3

# Web Search - optional, mock data used if not set
marketing.search.provider=serper
marketing.search.api-key=${MARKETING_SEARCH_API_KEY:}
marketing.search.base-url=https://google.serper.dev/search
marketing.search.max-results=5

# Yelp - optional
marketing.yelp.api-key=${MARKETING_YELP_API_KEY:}
marketing.yelp.base-url=https://api.yelp.com/v3
marketing.yelp.search-radius=5000
marketing.yelp.max-competitors=20

# Agent behavior
marketing.agent.max-tool-loops=5
marketing.agent.tool-timeout-seconds=10
marketing.agent.parallel-tool-calls=true
marketing.agent.allowed-origin=*

# Logging
logging.level.com.restaurant.marketing=INFO
logging.level.com.restaurant.marketing.agent=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{20} - %msg%n
